<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - ProjectFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">P</div>
        <span class="brand-name">ProjectFlow</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Core</div>
        <a href="/dashboard.html" class="nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="/projects.html" class="nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
          <span>My Projects</span>
        </a>

        <a href="/tasks.html" class="nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
          <span>My Tasks</span>
        </a>

        <a href="/notifications.html" class="nav-link active">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span>Notifications</span>
          <span class="nav-badge notification-unread-badge" style="display: none;">0</span>
        </a>

        <div class="nav-label">Settings</div>
        <a href="/profile.html" class="nav-link">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Profile</span>
        </a>

        <a href="javascript:void(0)" onclick="logoutUser()" class="nav-link" style="color: #f87171;">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Logout</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar current-user-avatar">U</div>
          <div class="user-info">
            <div class="user-name current-user-name">User Name</div>
            <div class="user-role current-user-role">MEMBER</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-navbar">
        <div class="navbar-left">
          <button class="menu-toggle-btn" id="sidebar-toggle" title="Toggle Navigation">
            <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <h2>Notification Center</h2>
        </div>

        <div class="navbar-right">
          <a href="/profile.html" style="display: flex; align-items: center; gap: 0.5rem;">
            <div class="user-avatar current-user-avatar" style="width: 32px; height: 32px; font-size: 0.75rem;">U</div>
          </a>
        </div>
      </header>

      <main class="app-content">
        <div class="page-header">
          <div class="page-title-group">
            <h1>Notifications</h1>
            <p>Stay updated on assignments, comments, team invites, and deadlines.</p>
          </div>
          <div>
            <button class="btn btn-secondary btn-sm" onclick="markAllNotificationsAsRead()">Mark All as Read</button>
          </div>
        </div>

        <!-- Notifications Card List -->
        <div class="card">
          <div id="full-notifications-list">
            <!-- Injected via notifications.js -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/api.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    initAuthGuard(false);
    initNotificationDropdown();

    async function loadAllNotificationsPage() {
      const data = await apiRequest('/notifications');
      const container = document.getElementById('full-notifications-list');
      if (!container) return;

      if (!data.notifications || data.notifications.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <h3>No notifications yet</h3>
            <p>You are all caught up with your workspace activity.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = data.notifications.map(n => `
        <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; background-color: ${n.isRead ? 'transparent' : 'var(--primary-light)'};">
          <div style="flex: 1;">
            <div style="font-size: 0.95rem; font-weight: ${n.isRead ? '400' : '600'}; color: var(--text-primary); margin-bottom: 0.25rem;">
              ${n.message}
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 0.75rem; align-items: center;">
              <span>${formatTimeAgo(n.createdAt)}</span>
              ${n.project ? `<span>• Project: <a href="/project-board.html?id=${n.project._id}">${n.project.name}</a></span>` : ''}
              <span class="badge badge-low" style="text-transform: capitalize;">${n.type.replace('_', ' ')}</span>
            </div>
          </div>
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            ${!n.isRead ? `
              <button class="btn btn-secondary btn-sm" onclick="handleNotificationClick('${n._id}')">Mark Read</button>
            ` : ''}
            <button class="btn-icon text-danger" title="Delete Notification" onclick="deleteNotificationById('${n._id}')">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    loadAllNotificationsPage();

    document.getElementById('sidebar-toggle')?.addEventListener('click', () => {
      document.getElementById('app-sidebar')?.classList.toggle('mobile-open');
    });
  </script>
</body>
</html>
